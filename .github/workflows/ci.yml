name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/vm-install/*.sh web01/agent/entrypoint.sh
      - name: yamllint
        run: yamllint -c .yamllint.yml wazuh/docker-compose.yml wazuh/generate-indexer-certs.yml web01/docker-compose.yml .github
      - name: compose files validate
        run: |
          sed 's/^\(INDEXER_PASSWORD\|DASHBOARD_PASSWORD\|API_PASSWORD\|ENROLL_PASSWORD\)=.*/\1=ci-placeholder/' wazuh/.env.example > ci.env
          docker compose -f wazuh/docker-compose.yml --env-file ci.env config -q
          docker compose -f web01/docker-compose.yml --env-file ci.env config -q
      - name: build agent image
        run: docker build -t web01-agent web01/agent
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No webhook URLs, bcrypt hashes or private keys committed
        run: |
          if git grep -nIE 'hooks\.slack\.com/services/[A-Z0-9]+|\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}|BEGIN (RSA |EC )?PRIVATE KEY' -- . ':!.github'; then
            echo "Possible secret committed"; exit 1; fi
